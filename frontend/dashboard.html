<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеохостинг - Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎬 Видеохостинг</h1>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </header>

    <div class="container">
        <!-- Форма загрузки -->
        <div class="upload-section">
            <h2>📤 Загрузить видео</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label>Название видео</label>
                    <input type="text" id="videoTitle" required placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Файл видео</label>
                    <input type="file" id="videoFile" accept="video/*" required>
                </div>
                <button type="submit">Загрузить</button>
            </form>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div id="uploadMessage" class="message"></div>
        </div>

        <!-- Поиск и сортировка -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Поиск видео по названию...">
            </div>
            <div class="sort-box">
                <select id="sortSelect">
                    <option value="uploaded_at">📅 По дате</option>
                    <option value="title">🔤 По названию</option>
                    <option value="likes">❤️ По лайкам</option>
                </select>
            </div>
        </div>

        <!-- Список видео -->
        <div id="videosList" class="videos-grid">
            <p style="text-align: center; grid-column: 1/-1;">Загрузка видео...</p>
        </div>
    </div>

    <script src="dist/script.js"></script>
</body>
</html>
